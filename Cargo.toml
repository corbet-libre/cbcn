[package]
name = "cbcn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Beacon: signed public trust-feed publication and bounded current cache"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cbcn"
publish = false

[dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
futures = { version = "0.3", features = ["executor"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
